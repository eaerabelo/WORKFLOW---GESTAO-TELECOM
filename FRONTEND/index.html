<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />

    <!-- Cor da barra superior do App/Navegador (Desktop & Mobile) -->
    <meta name="theme-color" content="#E3000F" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)" />
    <meta name="msapplication-navbutton-color" content="#E3000F" />
    <meta name="msapplication-TileColor" content="#171717" />
    <meta name="msapplication-TileImage" content="/pwa-192x192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
