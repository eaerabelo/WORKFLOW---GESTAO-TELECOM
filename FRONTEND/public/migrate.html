<!DOCTYPE html>
<html>
<head>
    <title>Migração de Dados (Firebase -> Oracle)</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDFZvBcVkrHrxSLKrdbaNB_ZIUFFw8BYLs",
            authDomain: "painel-claro.firebaseapp.com",
            projectId: "painel-claro",
            storageBucket: "painel-claro.firebasestorage.app",
            messagingSenderId: "767795934244",
            appId: "1:767795934244:web:bd50663666a474101854b1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const stores = [
            "uniao_osasco", "calcadao", "lapa", "shopping_bourbon", 
            "shopping_butanta", "shopping_higienopolis", "shopping_villa_lobos", 
            "shopping_west_plaza"
        ];

        async function logMsg(msg) {
            const p = document.createElement("p");
            p.textContent = msg;
            document.body.appendChild(p);
            console.log(msg);
        }

        async function run() {
            logMsg("Iniciando migração do Firebase para a API Oracle...");
            
            for (const store of stores) {
                try {
                    logMsg(`Buscando loja ${store} no Firebase...`);
                    const docRef = doc(db, 'lojas', `${store}_config`);
                    const snap = await getDoc(docRef);
                    
                    if (snap.exists()) {
                        const data = snap.data();
                        logMsg(`✅ Encontrado dados da loja ${store}! Sincronizando com a Oracle...`);
                        
                        const res = await fetch(`http://137.131.172.16/api/config/sync`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                storeId: store,
                                configData: data
                            })
                        });
                        const resData = await res.json();
                        logMsg(`Oracle: ${resData.message}`);
                    } else {
                        logMsg(`❌ Nenhum dado encontrado no Firebase para a loja ${store}.`);
                    }
                } catch (e) {
                    logMsg(`ERRO na loja ${store}: ${e.message}`);
                }
            }

            // Sync DEFAULT
            try {
                logMsg("Buscando loja DEFAULT no Firebase...");
                const docRef = doc(db, 'lojas', `DEFAULT_config`);
                const snap = await getDoc(docRef);
                
                if (snap.exists()) {
                    logMsg(`✅ Encontrado dados DEFAULT! Sincronizando com a Oracle...`);
                    const res = await fetch(`http://137.131.172.16/api/config/sync`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            storeId: 'DEFAULT',
                            configData: snap.data()
                        })
                    });
                    const resData = await res.json();
                    logMsg(`Oracle (DEFAULT): ${resData.message}`);
                } else {
                    logMsg(`❌ Nenhum dado DEFAULT encontrado. Tentando usar uniao_osasco como DEFAULT...`);
                    const uniao = await getDoc(doc(db, 'lojas', `uniao_osasco_config`));
                    if (uniao.exists()) {
                        const res = await fetch(`http://137.131.172.16/api/config/sync`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                storeId: 'DEFAULT',
                                configData: uniao.data()
                            })
                        });
                        const resData = await res.json();
                        logMsg(`Oracle (DEFAULT via uniao_osasco): ${resData.message}`);
                    }
                }
            } catch(e) {
                logMsg(`ERRO no DEFAULT: ${e.message}`);
            }

            logMsg("Migração finalizada! Você pode fechar esta aba e voltar para o sistema.");
        }

        window.onload = run;
    </script>
</head>
<body style="font-family: sans-serif; padding: 20px;">
    <h1>Migrador de Dados</h1>
    <p>Aguarde enquanto os dados são copiados para a Oracle...</p>
    <hr>
</body>
</html>
